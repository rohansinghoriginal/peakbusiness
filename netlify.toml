[build]
  command = "npm run build"
  publish = ".next"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@clerk/nextjs", "@supabase/supabase-js", "@supabase/ssr"]
  directory = "netlify/functions"
  included_files = ["app/api/**/*"]

# Enable Netlify Next.js plugin for proper Next.js deployment
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Disable secrets scanning for false positives
[build.environment]
  SECRETS_SCAN_ENABLED = "false"